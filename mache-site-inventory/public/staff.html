<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mache Staff Inventory</title>
<style>
:root{font-family:system-ui, sans-serif;color:#17251e;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:36px auto;padding:0 18px}.panel{background:white;border:1px solid #e2e6dd;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #17251e0b}h1{margin:0 0 5px;font-size:28px}.muted{color:#65736a;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce2d9;border-radius:10px;font:inherit;background:white}.field textarea{min-height:75px}.btn{border:0;border-radius:10px;background:#173d2c;color:white;padding:12px 17px;font-weight:750;cursor:pointer}.btn.secondary{background:#eaf0e6;color:#173d2c}.btn.danger{background:#8a3029}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #e8ebe5;padding:15px 0}.pill{font-size:12px;background:#edf3e8;padding:5px 9px;border-radius:20px}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#f2f5ef;margin:12px 0}.error{background:#fff0ed;color:#8a3029}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:18px}.wrap{margin:18px auto}}
</style></head><body><main class="wrap">
<header class="row"><div><h1>Mache Hardware</h1><div class="muted">Private staff inventory & availability</div></div><button id="logout" class="btn secondary hidden">Sign out</button></header>
<div id="notice" class="notice hidden" role="status"></div>
<section id="loginPanel" class="panel"><h2>Staff sign in</h2><p class="muted">This area is for authorised Mache staff only.</p><form id="loginForm"><div class="field"><label for="email">Staff email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Sign in</button></form></section>
<section id="appPanel" class="hidden">
<div class="panel"><div class="row"><div><h2>Add a product</h2><p class="muted">Changes appear in the public availability list after saving.</p></div></div>
<form id="itemForm">
<div class="grid"><div class="field"><label for="name">Product name *</label><input id="name" required maxlength="140"></div><div class="field"><label for="category">Category *</label><input id="category" required maxlength="80" placeholder="e.g. Plumbing"></div><div class="field"><label for="sku">SKU / product code</label><input id="sku" maxlength="80"></div><div class="field"><label for="availability">Availability *</label><select id="availability"><option value="available">Available</option><option value="low_stock">Low stock</option><option value="out_of_stock">Out of stock</option><option value="coming_soon">Coming soon</option></select></div><div class="field"><label for="quantity">Quantity (optional)</label><input id="quantity" type="number" min="0" step="1"></div><div class="field"><label for="unit">Unit</label><input id="unit" value="units" maxlength="30" placeholder="bags, pieces, lengths"></div><div class="field"><label for="expected_date">Expected restock date</label><input id="expected_date" type="date"></div><div class="field"><label for="public_note">Public note</label><input id="public_note" maxlength="240" placeholder="e.g. Call to confirm sizes"></div></div>
<div class="field"><label for="description">Description</label><textarea id="description" maxlength="500"></textarea></div><button class="btn">Save product</button></form></div>
<div class="panel"><div class="row"><div><h2>Inventory list</h2><p class="muted">Edit availability or hide products that are no longer listed.</p></div><button id="refresh" class="btn secondary">Refresh</button></div><div id="items"></div></div>
</section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const note=(msg,error=false)=>{$('notice').textContent=msg;$('notice').classList.remove('hidden','error');if(error)$('notice').classList.add('error');};async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;}
function showApp(on){$('loginPanel').classList.toggle('hidden',on);$('appPanel').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on);}
async function load(){const d=await api('/api/staff/inventory');$('items').innerHTML='';if(!d.items.length){$('items').textContent='No products added yet.';return;}for(const x of d.items){const el=document.createElement('article');el.className='item';const title=document.createElement('strong');title.textContent=x.name;const meta=document.createElement('div');meta.className='muted';meta.textContent=x.category+' · '+x.availability.replaceAll('_',' ')+' · Updated '+new Date(x.updated_at).toLocaleString();const controls=document.createElement('div');controls.className='actions';const status=document.createElement('select');for(const [v,t] of [['available','Available'],['low_stock','Low stock'],['out_of_stock','Out of stock'],['coming_soon','Coming soon']]){const o=document.createElement('option');o.value=v;o.textContent=t;status.append(o);}status.value=x.availability;const save=document.createElement('button');save.className='btn secondary';save.textContent='Update status';save.onclick=async()=>{try{await api('/api/staff/inventory/'+x.id,{method:'PATCH',body:JSON.stringify({availability:status.value})});note('Availability updated.');await load();}catch(e){note(e.message,true);}};const hide=document.createElement('button');hide.className='btn danger';hide.textContent=x.active?'Hide product':'Unhide product';hide.onclick=async()=>{try{await api('/api/staff/inventory/'+x.id,{method:'PATCH',body:JSON.stringify({active:!x.active})});note('Product visibility updated.');await load();}catch(e){note(e.message,true);}};controls.append(status,save,hide);el.append(title,meta,controls);$('items').append(el);}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});showApp(true);note('Signed in.');await load();}catch(err){note(err.message,true);}};
$('itemForm').onsubmit=async e=>{e.preventDefault();const keys=['name','category','sku','availability','quantity','unit','expected_date','public_note','description'];const b={};for(const k of keys)b[k]=$(k).value;if(b.quantity==='')b.quantity=null;if(b.expected_date==='')b.expected_date=null;try{await api('/api/staff/inventory',{method:'POST',body:JSON.stringify(b)});$('itemForm').reset();$('unit').value='units';note('Product saved and public availability updated.');await load();}catch(err){note(err.message,true);}};
$('logout').onclick=async()=>{await api('/api/staff/logout',{method:'POST'});showApp(false);note('Signed out.');};$('refresh').onclick=()=>load().catch(e=>note(e.message,true));
api('/api/staff/me').then(()=>{showApp(true);return load();}).catch(()=>showApp(false));
})();
</script></body></html>
