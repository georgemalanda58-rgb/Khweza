services:
  - type: web
    name: mtaani-api
    runtime: node
    plan: free
    rootDir: mtaani
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mtaani-db
          property: connectionString
databases:
  - name: mtaani-db
    databaseName: mtaani_db_5u6y
    user: mtaani_db_5u6y_user
    plan: free
    region: ohio
    postgresMajorVersion: 18
