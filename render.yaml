services:
  - type: web
    name: mtaani-api
    runtime: node
    plan: free
    region: ohio
    rootDir: mtaani
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PGHOST
        fromDatabase:
          name: mtaani-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: mtaani-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: mtaani-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: mtaani-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: mtaani-db
          property: database
databases:
  - name: mtaani-db
    databaseName: mtaani_db_5u6y
    user: mtaani_db_5u6y_user
    plan: free
    region: ohio
    postgresMajorVersion: 18
