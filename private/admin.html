<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khweza Staff Portal</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5f3ed}.admin{max-width:1100px;margin:auto;padding:35px 20px}.panel{background:white;padding:22px;margin:18px 0;border:1px solid #e5e1d7}.admin input,.admin textarea,.admin select{display:block;width:100%;padding:10px;margin:6px 0 14px;border:1px solid #ccc}.admin button{margin:5px 5px 5px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#254a3a;color:white;padding:10px;border:0}.item{border-bottom:1px solid #ddd;padding:12px 0}.hidden{display:none}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/">KHWEZA <small>STAFF PORTAL</small></a><a href="/">View public website</a></header><main class="admin"><h1>Staff & administration</h1><section id="login" class="panel"><h2>Sign in</h2><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p id="login-msg" role="status"></p></form></section><div id="dashboard" class="hidden"><div class="panel"><b id="who"></b> <button id="logout" class="btn">Sign out</button><div class="tabs"><button data-tab="rooms">Rooms</button><button data-tab="updates">Updates</button><button data-tab="menu">Menu</button><button data-tab="enquiries">Enquiries</button><button data-tab="staff" id="staff-tab">Staff accounts</button></div></div><div id="editor" class="panel"></div><div id="records" class="panel"></div></div></main><script src="/admin.js"></script></body></html>
